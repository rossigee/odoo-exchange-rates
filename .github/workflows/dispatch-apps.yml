---
name: Dispatch App Rebuilds

on:
  release:
    types: [published]

jobs:
  dispatch:
    name: Dispatch to consuming apps
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        repo:
          - odoo-bksc
          - odoo-pksc
          - odoo-rossgolderltd
          - odoo-family
          - bankrutrocks
    steps:
      - name: Send repository dispatch
        run: |
          curl -sSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/rossigee/${{ matrix.repo }}/dispatches \
            -d '{
              "event_type": "module-release",
              "client_payload": {
                "module": "odoo-exchange-rates",
                "version": "${{ github.event.release.tag_name }}"
              }
            }'

      - name: Notify
        if: failure()
        run: echo "Failed to dispatch to ${{ matrix.repo }}"
